[project]

name = "devops-application"
version = "0.1.0"
description = "Basic REST API for a devops class project"

requires-python = ">=3.12"
dependencies = [
    "adrf>=0.1.14",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "openai>=3.16.2",
    "uvicorn>=0.53.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff.lint]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
