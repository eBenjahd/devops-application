name: devops-application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configurar python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalamos uv
        uses: astral-sh/setup-uv@v7

      - name: Instalamos dependencias
        run: uv sync

      - name: Corremos basic tests
        run: uv run python manage.py test

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH connection successful'"

      - name: Archivos sensibles
        run: |
          ARCHIVE="/tmp/deploy.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.venv' \
            --exclude='*/__pycache__' \
            --exclude='./.env' \
            --exclude='./db.sqlite3' \
            --exclude='./deploy.tar.gz' \  
            -czf "$ARCHIVE" \
            -C "$GITHUB_WORKSPACE" .

      - name: Pegamos proyecto a server
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            deploy.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/consultor/

      - name: Ejecutamos deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "
              cd /var/www/consultor &&
              tar -xzf deploy.tar.gz &&
              rm deploy.tar.gz &&
              chmod +x scripts/deploy.sh &&
              ./scripts/deploy.sh
            "
